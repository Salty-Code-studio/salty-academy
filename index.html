  .pack .numpill { border:1px solid currentColor; border-radius:999px; padding:.25rem .8rem; opacity:.85; }

  .pack h3 { margin:0 0 .4rem; font-size:1.22rem; font-weight:700; }
  .pack .desc { font-size:.95rem; opacity:.85; margin:0 0 1rem; flex:1; }
  .pack .recall { display:flex; justify-content:space-between; font-size:.82rem; opacity:.9; margin-bottom:.4rem; }
  .pack .bar { height:5px; border-radius:99px; background:rgba(128,128,128,.28); margin-bottom:1.1rem; }
  .pack .bar i { display:block; height:5px; border-radius:99px; background:currentColor; }
  .pack .actions { display:flex; align-items:center; justify-content:space-between; gap:.8rem; flex-wrap:wrap; }

  .pack .done { font-size:.78rem; font-weight:700; letter-spacing:.08em; }

    .topin { padding:.85rem 1rem; }
    nav.main { width:100%; overflow-x:auto; }
    .pack { min-height:0; }
  }
</style>

function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
if (!S.players) S.players = {};
function P(){ return S.players[S.current]; }
function newPlayer(name){
  S.players[name] = window.SA_STORAGE.blankPlayer();
  S.current = name; save();
}
var migrationNotice = !!S.migratedFromV1;
if (migrationNotice){ delete S.migratedFromV1; save(); }
function today(){ return new Date().toISOString().slice(0,10); }
function touchStreak(){
  var p = P(), t = today();
  if (p.lastDay === t) return;
  var y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  p.streak = (p.lastDay === y) ? p.streak+1 : 1;
  p.lastDay = t;
  if (p.streak >= 7) grant("streak7");
  save();
}
function rankObj(xp){ var r = RANKS[0]; RANKS.forEach(function(x){ if (xp>=x[0]) r=x; }); return r; }
function rank(xp){ return rankObj(xp)[1]; }
function rankIco(xp){ return rankObj(xp)[2]; }
function nextRank(xp){ for (var i=0;i<RANKS.length;i++){ if (xp<RANKS[i][0]) return RANKS[i]; } return null; }
var BADGES = {
  streak7:{ico:"🔥",name:"7-day streak"},
  perfect:{ico:"💯",name:"Perfect mastery round"},
  words:{ico:"📖",name:"Word collector"},
  master:{ico:"🏆",name:"Academy Master"}
};
MODS.forEach(function(m){ BADGES["boss-"+m.id] = {ico:m.icon, name:m.num+" mastered"}; });
function grant(id){ var p=P(); if (p.badges.indexOf(id)<0){ p.badges.push(id); save(); } }
function itemsOf(m){ return (IDX.byPack[m.id] || []).map(function(it){ return it.id; }); }
function mastery(m){ return MY.packMastery(P(), m.id); }
function totalMastery(){ return MY.totalMastery(P()); }
function recalled(m){
  var p = P(), right = p.right || {}, n = 0;
  (IDX.byPack[m.id] || []).forEach(function(it){
    if (it.format === "flash" && right[it.id]) n++;
  });
  return n;
}
function toRevisit(m){
  var p = P(), n = 0;
  (p.wrongQueue || []).forEach(function(id){
    var it = IDX.byId[id];
    if (it && it.pack === m.id) n++;
  });
  return n;
}
/* One call from every answer path: records the concept movement, the seen flag and the review queue. */
function recordAnswer(item, correct, confidence){
  var p = P();
  if (!p.right) p.right = {};
  p.seen[item.id] = (p.seen[item.id] || 0) + 1;
  if (correct) p.right[item.id] = 1;
  MY.record(p, item.concepts, correct, confidence, NOW());
  var at = p.wrongQueue.indexOf(item.id);
  if (correct){ if (at >= 0) p.wrongQueue.splice(at, 1); }
  else if (confidence === "know"){
    if (at >= 0) p.wrongQueue.splice(at, 1);
    p.wrongQueue.unshift(item.id);
  } else {
    if (at < 0) p.wrongQueue.push(item.id);
  }
  save();
  checkAll();
}
function checkAll(){
  var p=P(), right = p.right || {}, all=true;
  IDX.items.forEach(function(it){ if (it.format==="flash" && !right[it.id]) all=false; });
  if (all) grant("words");
  if (MODS.every(function(m){ return p.boss[m.id]; })) grant("master");
}
function addXP(n){ var p=P(); var before=rank(p.xp); p.xp+=n; save();
  if (rank(p.xp)!==before) toastRank = rank(p.xp); }
var toastRank = null;
function shuffle(a){ a=a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(html){ var d=document.createElement("div"); d.innerHTML=html; return d; }
function mod(id){ return MODS.filter(function(x){return x.id===id;})[0]; }
var app = document.getElementById("app");
var view = "learn";
function render(html){ app.innerHTML = html; window.scrollTo(0,0); syncNav(); }
function syncNav(){
  document.querySelectorAll("#nav button[data-v]").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-v")===view);
  });
  var np=document.getElementById("navplayer");
  np.textContent = S.current ? S.current : "Player";
}
function ring(pct, color){
  var r=17, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<span class="ring"><svg viewBox="0 0 42 42">'
    + '<circle class="bg" cx="21" cy="21" r="'+r+'" fill="none" stroke-width="4"/>'
    + '<circle class="fg" cx="21" cy="21" r="'+r+'" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"'+(color?' style="stroke:'+color+'"':'')+'/>'
    + '<text x="21" y="25" text-anchor="middle">'+pct+'</text></svg></span>';
}
function donut(size, label){
  var w = Math.round(size*0.1), r = (size - w - 2)/2, cx = size/2, c = 2*Math.PI*r;
  var segLen = c/MODS.length, gap = Math.max(2, c*0.008), base = segLen - gap;
  var svg = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
  MODS.forEach(function(m,i){
    var a = TH(m.id).acc, frac = mastery(m)/100;
    var rot = 'transform="rotate('+(i*(360/MODS.length)-90)+' '+cx+' '+cx+')"';
    svg += '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+a+'" stroke-opacity=".18" stroke-width="'+w+'" stroke-dasharray="'+base+' '+(c-base)+'" '+rot+'/>';
    if (frac>0.01) svg += '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+a+'" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+(base*frac)+' '+(c-base*frac)+'" '+rot+'/>';
  });
  var p = P();
  svg += '<text x="'+cx+'" y="'+(cx-size*0.02)+'" text-anchor="middle" style="font-size:'+(size*0.22)+'px">'+rankIco(p.xp)+'</text>'
    + '<text x="'+cx+'" y="'+(cx+size*0.16)+'" text-anchor="middle" style="font-size:'+(size*0.085)+'px;font-weight:700;fill:var(--ink)">'+p.xp+' xp</text>'
    + '</svg>';
  return '<div class="donutwrap">'+svg+(label?'<div class="dlabel">'+esc(label)+'</div>':'')+'</div>';
}

/* ---------- play engine ---------- */
var run = null;
function wrap(it){ return { kind:it.format, id:it.id, data:it.data, mod:mod(it.pack), item:it }; }
function poolMC(m){
  return (IDX.byPack[m.id] || []).filter(function(it){
    return it.use === "module" && ["quiz","translate","diagnose"].indexOf(it.format) >= 0;
  }).map(wrap);
}
function startRun(mode, m, items, back){
  run = { mode:mode, mod:m, items:items, i:0, score:0, xp:0, back:back||view };
  touchStreak(); var p=P(); p.plays++; if (m) p.last={mod:m.id}; save();
}
function sprintRun(id){
  var m = mod(id);
  startRun("sprint", m, shuffle(poolMC(m)).slice(0,8), "sprint");
  ideaScreen(m, "sprint");
}
function bossRun(id){
  var m = mod(id);
  startRun("boss", m, shuffle(poolMC(m)).slice(0,BOSS_N), "sprint");
  ideaScreen(m, "boss");
}
function cardsRun(id){
  var m = mod(id);
  var pool = (IDX.byPack[m.id] || []).filter(function(it){ return it.format === "flash"; }).map(wrap);
  startRun("cards", m, shuffle(pool), "learn");
  step();
}
function speakOne(id, i){
  var m = mod(id);
  var speakItems = (IDX.byPack[m.id] || []).filter(function(it){ return it.format === "speak"; });
  startRun("speak", m, [wrap(speakItems[i])], "speak");
  step();
}
function reviewRun(){
  var p = P(), items = [];
  p.wrongQueue.slice(0, 12).forEach(function(id){
    var it = IDX.byId[id];
    if (it) items.push({ kind: it.format, id: it.id, data: it.data, mod: mod(it.pack), item: it });
  });
  startRun("review", null, items, "learn");
  step();
}
function ideaScreen(m, mode){
  view = "sprint";
  var t = TH(m.id);
  render(playbar(m.num+' · '+(mode==="boss"?"Mastery round":"Salty Sprint"))
    + '<div class="narrow"><div class="idea" style="background:'+t.g+';color:'+t.ink+'">'
    + '<p class="eyebrow">Before you start</p>'
    + '<div class="big" style="font-size:1.15rem;margin-bottom:.3rem">One idea to hold on to.</div>'
    + '<div class="big" style="color:#D8CDB4">'+esc(m.idea||"")+'</div>'
    + '<p style="font-size:.92rem;opacity:.85">'+(mode==="boss"? BOSS_N+' mixed questions, '+BOSS_PASS+' needed to master this pack.':'Try 8 questions. You will get an explanation after every answer. Guessing is useful too, just tell us.')+'</p>'
    + '<div class="mono-steps">01 · Think&nbsp;&nbsp;&nbsp;02 · Check&nbsp;&nbsp;&nbsp;03 · Say it</div>'
    + '<button class="btn" onclick="GA.begin()">Let\'s go →</button>'
    + '</div></div>');
}
function playbar(title){
  return '<div class="playbar"><button onclick="GA.quitRun()">← Back</button><span class="grow"></span><span>'+esc(title)+'</span></div>';
}
function step(){
  if (!run || run.i >= run.items.length) return results();
  var it = run.items[run.i];
  var label = (run.mode==="review" ? "Review" : run.mod.num+' · '+(run.mode==="boss"?"Mastery":run.mode==="cards"?"Flashcards":run.mode==="speak"?"Talk from Three":"Salty Sprint"));
  var h = playbar(label + ' · ' + (run.i+1) + '/' + run.items.length)
    + '<div class="progressline"><i style="width:'+Math.round(100*run.i/run.items.length)+'%"></i></div>'
    + '<div class="narrow">';
  if (it.kind==="cards" || it.kind==="flash") h += renderCard(it);
  else if (it.kind==="speak") h += renderSpeak(it);
  else if (it.kind==="open") h += renderOpen(it);
  else if (it.kind==="match") h += renderMatch(it);
  else h += renderMC(it);
  h += '</div>';
  view = run.back;
  render(h);
}
function renderCard(it){
  var c = it.data;
  return '<p class="eyebrow">Flashcard · tap to flip</p>'
    + '<div class="flash" id="flash" onclick="GA.flip()"><div class="flashinner">'
    + '<div class="face"><span class="term">'+esc(c.t)+'</span><span class="muted" style="margin-top:.6rem">what does it mean, and how do you say it on camera?</span></div>'
    + '<div class="face back"><span class="def">'+esc(c.d)+'</span><span class="say">&ldquo;'+esc(c.s)+'&rdquo;</span></div>'
    + '</div></div>'
    + '<div id="grade" style="display:none">'
    + '<button class="btn wide" onclick="GA.card(true)">✓ I knew it</button>'
    + '<button class="btn wide ghost" onclick="GA.card(false)">↻ Not yet, show it again later</button></div>'
    + '<p class="muted" id="fliphint">Say your answer out loud first, then flip.</p>';
}
function renderSpeak(it){
  var d = it.data;
  var chips = d.words.map(function(w){ return '<span class="chip">'+esc(w)+'</span>'; }).join(" ");
  return '<p class="eyebrow">Talk from Three · no recording, just you</p>'
    + '<p class="qtext">'+esc(d.prompt)+'</p>'
    + '<div class="wordchips">'+chips+'</div>'
    + '<p class="muted">Speak your answer out loud for about thirty seconds, using the three words as anchors. Then reveal the talking points and grade yourself honestly.</p>'
    + '<div id="speakreveal"><button class="btn" onclick="GA.reveal()">Reveal the talking points</button></div>';
}
function renderMC(it){
  var d = it.data;
  var isQuote = it.kind==="diagnose";
  var prompt = it.kind==="quiz" ? d.q : it.kind==="translate" ? d.setup : d.say;
  var eyebrow = it.kind==="quiz" ? "Name the concept" : it.kind==="translate" ? "Pick the human answer" : "Diagnose the real problem";
  var opts = d.a.map(function(txt,i){ return {txt:txt, ok:i===0}; });
  it.shuffled = shuffle(opts);
  it.conf = null;
  var h = '<p class="eyebrow">'+eyebrow+'</p>';
  if (isQuote){ h += '<p class="qtext">What is really going on?</p><div class="quote">'+esc(prompt)+'</div>'; }
  else h += '<p class="qtext">'+esc(prompt)+'</p>';
  h += '<p class="muted" style="margin:.2rem 0 .3rem">First: how sure are you?</p>'
    + '<div class="confrow">'
    + '<button class="chip" id="conf-guess" onclick="GA.conf(\'guess\')">I am guessing</button>'
    + '<button class="chip" id="conf-pretty" onclick="GA.conf(\'pretty\')">Pretty sure</button>'
    + '<button class="chip" id="conf-know" onclick="GA.conf(\'know\')">I know this</button>'
    + '</div>';
  it.shuffled.forEach(function(o,i){
    h += '<button class="opt" id="opt'+i+'" disabled onclick="GA.answer('+i+')">'
      + '<span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(o.txt)+'</span></button>';
  });
  h += '<p class="muted" id="confhint" style="font-size:.78rem">Pick one of the three above to unlock the answers. Being honest here is the whole point.</p>';
  return h;
}
function renderOpen(it){
  var d = it.data;
  it.conf = null;
  return '<p class="eyebrow">In your own words</p>'
    + '<p class="qtext">' + esc(d.ask) + '</p>'
    + '<p class="muted" style="margin:.2rem 0 .3rem">First: how sure are you?</p>'
    + '<div class="confrow">'
    + '<button class="chip" id="conf-guess" onclick="GA.conf(\'guess\')">I am guessing</button>'
    + '<button class="chip" id="conf-pretty" onclick="GA.conf(\'pretty\')">Pretty sure</button>'
    + '<button class="chip" id="conf-know" onclick="GA.conf(\'know\')">I know this</button>'
    + '</div>'
    + '<textarea id="openans" rows="4" placeholder="Two or three sentences is plenty. Write it the way you would say it out loud."></textarea>'
    + '<button class="btn wide" id="opensubmit" disabled onclick="GA.submitOpen()">Check my answer</button>'
    + '<p class="muted" id="confhint" style="font-size:.78rem">Pick one of the three above first.</p>';
}
function renderMatch(it){
  var d = it.data;
  it.conf = null;
  it.picks = {};
  it.left = d.pairs.map(function(p, i){ return { i:i, txt:p.l }; });
  it.right = window.SA_UTIL.shuffle(d.pairs.map(function(p, i){ return { i:i, txt:p.r }; }));
  var h = '<p class="eyebrow">Match them up</p><p class="qtext">' + esc(d.ask) + '</p>'
    + '<p class="muted" style="margin:.2rem 0 .3rem">First: how sure are you?</p>'
    + '<div class="confrow">'
    + '<button class="chip" id="conf-guess" onclick="GA.conf(\'guess\')">I am guessing</button>'
    + '<button class="chip" id="conf-pretty" onclick="GA.conf(\'pretty\')">Pretty sure</button>'
    + '<button class="chip" id="conf-know" onclick="GA.conf(\'know\')">I know this</button>'
    + '</div><div class="matchgrid">';
  it.left.forEach(function(l){
    h += '<div class="matchrow"><div class="ml">' + esc(l.txt) + '</div><select class="mr" id="m'+l.i+'">'
      + '<option value="">pick one</option>';
    it.right.forEach(function(r){ h += '<option value="'+r.i+'">' + esc(r.txt) + '</option>'; });
    h += '</select></div>';
  });
  h += '</div><button class="btn wide" id="matchsubmit" disabled onclick="GA.submitMatch()">Check</button>'
    + '<p class="muted" id="confhint" style="font-size:.78rem">Pick one of the three above first.</p>';
  return h;
}
function results(){
  if (!run) return learn();
  var p=P(), n=run.items.length, sc=run.score, m=run.mod;
  var labels = {sprint:"Salty Sprint", boss:"Mastery round", cards:"Flashcards", speak:"Talk from Three", review:"Review"};
  if (!p.history) p.history = [];
  p.history.push({ t: Date.now(), pack: m?m.id:null, label: labels[run.mode]||run.mode, score: sc, n: n });
  if (p.history.length > 40) p.history = p.history.slice(-40);
  var passedBoss=false, perfect=false;
  if (run.mode==="boss" && m){
    if (sc>=BOSS_PASS){ passedBoss=true;
      if (!p.boss[m.id]){ p.boss[m.id]=1; grant("boss-"+m.id); addXP(XP.bossPass); run.xp+=XP.bossPass; }
      if (sc===n){ perfect=true; grant("perfect"); }
      checkAll();
    }
  }
  save();
  var emoji = run.mode==="boss" ? (passedBoss ? (perfect?"👑":"⚔️") : "🫧") : (sc===n && n>1 ? "🌊" : "👍");
  var line = run.mode==="boss"
    ? (passedBoss ? (perfect? "Flawless. "+m.num+" never stood a chance." : m.num+" mastered.")
       : sc+"/"+n+", you need "+BOSS_PASS+". Read, drill, come back.")
    : (run.mode==="speak" ? "Practice makes fluent." : sc+" of "+n+" · +"+run.xp+" xp");
  var back = run.back, mid = m ? m.id : null, mode = run.mode;
  var h = playbar(run.mode==="review"?"Review":(m?m.num:""))
    + '<div class="narrow center"><div class="result-big">'+emoji+'</div>'
    + '<h1 style="font-size:1.7rem">'+esc(line)+'</h1>'
    + '<p class="muted">Total: '+p.xp+' xp · '+esc(rank(p.xp))+(p.wrongQueue.length? ' · '+p.wrongQueue.length+' to revisit':'')+'</p><br>';
  if (mode==="sprint" && mid) h += '<button class="btn wide" onclick="GA.sprintRun(\''+mid+'\')">Sprint again</button>';
  if (mode==="boss" && mid && !passedBoss) h += '<button class="btn wide" onclick="GA.bossRun(\''+mid+'\')">Try the mastery round again</button>';
  if (mode==="cards" && mid) h += '<button class="btn wide" onclick="GA.cards(\''+mid+'\')">Another round of cards</button>';
  h += '<button class="btn wide dark" onclick="GA.nav(\''+back+'\')">Done</button></div>';
  run = null;
  render(h);
}

function teachPanel(item, headline){
  var d = item.data;
  var primary = item.concepts.length ? CN.byId(item.concepts[0]) : null;
  var h = '<div class="why">' + (headline || "")
    + esc(d.why || "") + '</div>';
  if (primary){
    h += '<div class="teach"><p class="eyebrow">The idea underneath</p>'
      + '<b>' + esc(primary.name) + '</b>'
      + '<p>' + esc(primary.plain) + '</p>'
      + '<p class="muted"><b>For example:</b> ' + esc(primary.example) + '</p>'
      + '<p class="clientline"><b>Say it to a client:</b> &ldquo;' + esc(primary.client) + '&rdquo;</p>'
      + '</div>';
  }
  var extra = CN.findInText([d.q, d.setup, d.say, d.ask, d.why, (d.a||[])[0]].join(" "))
    .filter(function(c){ return !primary || c.id !== primary.id; })
    .slice(0, 4);
  if (extra.length){
    h += '<p class="muted" style="margin:.7rem 0 .3rem">Terms in this question, tap to open:</p><div class="termrow">';
    extra.forEach(function(c){
      h += '<button class="chip term" onclick="GA.term(\'' + esc(c.id) + '\')">' + esc(c.name) + '</button>';
    });
    h += '</div><div id="termbox"></div>';
  }
  return h;
}

function showOpenResult(it, r){
  var d = it.data;
  var icon = r.state === "understood" ? "🌊" : r.state === "partial" ? "〰️" : "🫧";
  var word = r.state === "understood" ? "Understood" : r.state === "partial" ? "Partly understood" : "Not yet";
  var h = "";

  if (r.lowConfidence){
    /* The grader is not sure, so it does not pretend. The learner decides, honestly. */
    h = '<div id="selfgrade"><div class="why"><b>I am not sure how to score that one.</b><br>'
      + 'Read the model answer and tell me honestly.</div>'
      + '<div class="teach"><b>The answer we were looking for</b><p>' + esc(d.model) + '</p></div>'
      + '<button class="btn wide" onclick="GA.selfGrade(\'understood\')">I said that, in my own words</button>'
      + '<button class="btn wide dark" onclick="GA.selfGrade(\'partial\')">Half of it</button>'
      + '<button class="btn wide ghost" onclick="GA.selfGrade(\'notyet\')">No, I missed it</button></div>';
    document.querySelector(".narrow").appendChild(el(h));
    window.scrollTo(0, document.body.scrollHeight);
    return;
  }

  gradeOpenFinal(it, r.state, '<b>' + icon + ' ' + word + '.</b> ' + esc(r.reason) + ' ' + esc(r.nudge) + '<br>');
}

function gradeOpenFinal(it, state, headline){
  if (it.answered) return;
  it.answered = true;
  var correct = state === "understood";
  var conf = it.conf || "pretty";
  /* Partly understood counts as a miss for the concept box but is not sent to the review queue as a
     confident error, so it drops one box instead of resetting. That is what "partial" should cost. */
  recordAnswer(it.item, correct, correct ? conf : (conf === "know" && state === "partial" ? "pretty" : conf));
  var gain = correct ? (run.mode === "boss" || run.mode === "mastery" ? XP.bossQ : XP.sprint) + (CONF_BONUS[conf] || 0)
                     : (state === "partial" ? Math.floor(XP.sprint / 2) : 0);
  if (correct) run.score++;
  if (state === "partial") run.partial = (run.partial || 0) + 1;
  run.xp += gain; addXP(gain);
  var extra = teachPanel(it.item, headline)
    + '<div class="teach"><b>The answer we were looking for</b><p>' + esc(it.data.model) + '</p></div>'
    + '<button class="btn wide" onclick="GA.next()">'
    + (run.i+1 >= run.items.length ? 'Finish' : 'Next') + ' →</button>';
  var box = document.getElementById("selfgrade");
  if (box) box.remove();
  document.querySelector(".narrow").appendChild(el(extra));
  window.scrollTo(0, document.body.scrollHeight);
}

/* ---------- interactions ---------- */
window.GA = {
  nav:function(v){
    if (v==="learn") learn();
    else if (v==="sprint") sprintHome();
    else if (v==="speak") speakHome();
    else if (v==="library") libraryView();
    else if (v==="progress") progressView();
  },
  pick:pickPlayer,
  choose:function(n){ S.current=n; save(); learn(); },
  create:function(){
    var v = document.getElementById("pname").value.trim();
    if (!v) return;
    if (!S.players[v]) newPlayer(v); else { S.current=v; save(); }
    learn();
  },
  sprintRun:sprintRun, bossRun:bossRun, cards:cardsRun, speakOne:speakOne, review:reviewRun,
  speakFilter:function(f){ speakHome(f); },
  libTab:function(f){ libraryView(f); },
  begin:function(){ step(); },
  quitRun:function(){ var b = run ? run.back : "learn"; run=null; GA.nav(b); },
  flip:function(){
    var f=document.getElementById("flash");
    f.classList.toggle("flipped");
    document.getElementById("grade").style.display="block";
    var hint=document.getElementById("fliphint"); if(hint) hint.style.display="none";
  },
  card:function(knew){
    var it = run.items[run.i];
    if (it.answered) return;
    it.answered = true;
    if (knew){ run.score++; run.xp+=XP.cards; addXP(XP.cards); }
    recordAnswer(it.item, knew, knew ? "pretty" : "guess");
    run.i++; step();
  },
  conf:function(level){
    var it = run.items[run.i]; it.conf = level;
    ["guess","pretty","know"].forEach(function(l){
      var b = document.getElementById("conf-"+l);
      if (b) b.classList.toggle("sel", l===level);
    });
    document.querySelectorAll(".opt").forEach(function(b){ b.disabled = false; });
    var openBtn = document.getElementById("opensubmit");
    if (openBtn) openBtn.disabled = false;
    var matchBtn = document.getElementById("matchsubmit");
    if (matchBtn) matchBtn.disabled = false;
    var hint = document.getElementById("confhint");
    if (hint) hint.textContent = "No timer. Think it through.";
  },
  term:function(id){
    var c = CN.byId(id), box = document.getElementById("termbox");
    if (!c || !box) return;
    box.innerHTML = '<div class="teach"><b>' + esc(c.name) + '</b>'
      + '<p>' + esc(c.plain) + '</p>'
      + '<p class="muted"><b>For example:</b> ' + esc(c.example) + '</p>'
      + '<p class="clientline"><b>Say it to a client:</b> &ldquo;' + esc(c.client) + '&rdquo;</p></div>';
  },
  reveal:function(){
    var it = run.items[run.i], d = it.data;
    var pts = d.points.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join("");
    document.getElementById("speakreveal").innerHTML =
      '<div class="why"><b>The talking points:</b><ul style="margin:.5rem 0 0;padding-left:1.2rem">'+pts+'</ul></div>'
      + '<p class="muted">How did it go, honestly?</p>'
      + '<button class="btn wide" onclick="GA.speakGrade(2)">🌊 Nailed it · flowed naturally</button>'
      + '<button class="btn wide dark" onclick="GA.speakGrade(1)">〰️ Halfway · hit some points, stumbled</button>'
      + '<button class="btn wide ghost" onclick="GA.speakGrade(0)">🫧 Blanked · show it again later</button>';
    window.scrollTo(0, document.body.scrollHeight);
  },
  speakGrade:function(level){
    var it = run.items[run.i];
    if (it.answered) return;
    it.answered = true;
    if (level===2){ run.score++; run.xp+=XP.speak; addXP(XP.speak); recordAnswer(it.item, true, "pretty"); }
    else if (level===1){ run.xp+=Math.floor(XP.speak/2); addXP(Math.floor(XP.speak/2)); recordAnswer(it.item, true, "guess"); }
    else recordAnswer(it.item, false, "guess");
    run.i++; step();
  },
  answer:function(i){
    var it = run.items[run.i], picked = it.shuffled[i];
    if (!it.conf) return;
    if (it.answered) return;
    it.answered = true;
    it.shuffled.forEach(function(o,j){
      var b=document.getElementById("opt"+j); b.disabled=true;
      if (o.ok) b.classList.add("correct");
      else if (j===i) b.classList.add("wrong");
    });
    document.querySelectorAll(".confrow button").forEach(function(b){ b.disabled=true; });
    var gain = (run.mode==="boss" ? XP.bossQ : XP.sprint) + (picked.ok ? (CONF_BONUS[it.conf]||0) : 0);
    var confNote = "";
    if (picked.ok){ run.score++; run.xp+=gain; addXP(gain);
      if (it.conf==="know") confNote = " Called it, too: +"+CONF_BONUS.know+" xp.";
    } else {
      if (it.conf==="know") confNote = " You were sure about this one, so it goes to the front of your review queue.";
      else if (it.conf==="guess") confNote = " Honest guess, no harm: now you know it.";
    }
    recordAnswer(it.item, picked.ok, it.conf);
    var d=it.data;
    var headline = picked.ok
      ? '<b>Correct.</b> '
      : '<b>The answer was:</b> ' + esc(d.a[0]) + '<br>';
    var extra = teachPanel(it.item, headline + esc(confNote) + ' ')
      + '<button class="btn wide" onclick="GA.next()">'
      + (run.i+1 >= run.items.length ? 'Finish' : 'Next') + ' →</button>';
    document.querySelector(".narrow").appendChild(el(extra));
    window.scrollTo(0, document.body.scrollHeight);
  },
  submitOpen:function(){
    var it = run.items[run.i];
    if (!it.conf) return;
    if (it.answered) return;
    var answer = document.getElementById("openans").value;
    document.getElementById("opensubmit").disabled = true;
    document.getElementById("openans").disabled = true;
    document.querySelectorAll(".confrow button").forEach(function(b){ b.disabled = true; });
    window.SA_AI.grade(it.item, answer).then(function(r){ showOpenResult(it, r); });
  },
  selfGrade:function(state){
    var it = run.items[run.i];
    if (it.answered) return;
    var p = P();
    p.openFlags.push({ id: it.item.id, at: NOW(), said: state });
    if (p.openFlags.length > 50) p.openFlags = p.openFlags.slice(-50);
    save();
    document.querySelectorAll(".narrow .btn").forEach(function(b){ b.remove(); });
    gradeOpenFinal(it, state, "<b>Your call.</b> ");
  },
  submitMatch:function(){
    var it = run.items[run.i], right = 0, total = it.left.length;
    if (!it.conf) return;
    if (it.answered) return;
    it.answered = true;
    it.left.forEach(function(l){
      var sel = document.getElementById("m"+l.i);
      sel.disabled = true;
      var ok = sel.value !== "" && Number(sel.value) === l.i;
      sel.parentNode.classList.add(ok ? "correct" : "wrong");
      if (ok) right++;
    });
    document.getElementById("matchsubmit").disabled = true;
    document.querySelectorAll(".confrow button").forEach(function(b){ b.disabled = true; });
    var correct = right === total;
    recordAnswer(it.item, correct, it.conf || "pretty");
    var gain = correct ? XP.sprint + (CONF_BONUS[it.conf] || 0) : 0;
    if (correct) run.score++;
    run.xp += gain; addXP(gain);
    var headline = '<b>' + right + ' of ' + total + ' matched.</b> ';
    var extra = teachPanel(it.item, headline)
      + '<button class="btn wide" onclick="GA.next()">'
      + (run.i+1 >= run.items.length ? 'Finish' : 'Next') + ' →</button>';
    document.querySelector(".narrow").appendChild(el(extra));
    window.scrollTo(0, document.body.scrollHeight);
  },
  next:function(){ run.i++; step(); },
  libFilter:function(v){
    v = v.trim().toLowerCase();
    document.querySelectorAll(".lib-item").forEach(function(d){
      d.style.display = (!v || d.getAttribute("data-term").indexOf(v)>=0) ? "" : "none";
    });
  }
};
learn();
})();
</script>
</body>
</html>
